# Release build + unit tests on Windows (MSVC), Linux (GCC) and macOS (Apple Silicon, Clang; macos-15: GitHub retired the macos-14 image), N25.
# Warnings are errors here (DAPHNE_WARNINGS_AS_ERRORS: /W4 on MSVC, -Wall -Wextra elsewhere). One Linux job
# builds with the system's FFmpeg (pkg-config), so the FFmpeg decoder is compiled and tested outside
# Windows too; the others build as on a machine without FFmpeg or the ASIO SDK. The player tests run on a
# fake device (tests/fake_output.h); real WASAPI / ASIO output is checked with verify/live.py.
# Tube Color (doc/N28): the *-color jobs build with DAPHNE_COLOR_TEST_CURVE (the M1 test curve, so the stage's logic
# is tested on all three platforms); the other jobs are release builds, where color.enabled true must change nothing.
name: build

on:
  push:
    # tube-color: the Tube Color integration branch (doc/N28: its milestones' PRs go there, it goes to main at the end)
    branches: [main, cross-platform-plan, tube-color]
  pull_request:   # every PR, whatever its base (main, tube-color)
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: linux, os: ubuntu-latest }
          - { name: linux-ffmpeg, os: ubuntu-latest, ffmpeg: true }
          - { name: macos, os: macos-15 }
          - { name: windows-color, os: windows-latest, color_test: true }
          - { name: linux-color, os: ubuntu-latest, color_test: true }
          - { name: macos-color, os: macos-15, color_test: true }
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg
        if: matrix.ffmpeg
        run: sudo apt-get update && sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDAPHNE_WARNINGS_AS_ERRORS=ON -DDAPHNE_COLOR_TEST_CURVE=${{ matrix.color_test && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # the Mac shell (miku/*.js): its syntax, and the engine against a fake helper client
      - name: Mac shell (JavaScript)
        if: matrix.name == 'linux'
        run: |
          for f in miku/*.js; do node --check "$f"; done
          node tests/miku_engine.js
